<button
  type="button"
  class="app-select__trigger"
  [class.app-select__trigger--open]="open()"
  [class.app-select__trigger--icon]="icon()"
  [disabled]="disabled()"
  [attr.aria-haspopup]="'listbox'"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="ariaLabel() || null"
  [attr.title]="icon() ? ariaLabel() || null : null"
  (click)="toggle()"
>
  @if (icon()) {
    <app-category-icon [icon]="icon()" />
  } @else {
    <span class="app-select__label">{{ selectedLabel() }}</span>
    <span class="app-select__chevron" aria-hidden="true"></span>
  }
</button>

@if (open()) {
  <div class="app-select__backdrop" (click)="close()"></div>
  <div
    class="app-select__panel"
    [class.app-select__panel--right]="icon()"
    role="listbox"
    [attr.aria-label]="ariaLabel() || null"
  >
    @for (option of options(); track option.value) {
      <button
        type="button"
        role="option"
        class="app-select__option"
        [class.app-select__option--selected]="option.value === value()"
        [attr.aria-selected]="option.value === value()"
        (click)="select(option)"
      >
        {{ option.label }}
      </button>
    }
  </div>
}
